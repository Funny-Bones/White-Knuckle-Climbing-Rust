[package]
name = "white_knuckle_climbing"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.19", features = ["wav"] }
bevy_rapier3d = "0.36.0"

# Bevy is unusably slow unoptimised; keep our own crate quick to rebuild.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
